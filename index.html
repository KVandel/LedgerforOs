<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — Resale Business System</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Special+Elite&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');

:root{
  --shell:#1B222C;
  --paper:#F7F2E4;
  --paper-2:#EFE8D4;
  --ink:#262019;
  --ink-soft:#6b6152;
  --line: rgba(38,32,25,0.14);
  --stamp:#A5311F;
  --stamp-dark:#7c2416;
  --jade:#2F6B5E;
  --jade-dark:#204c43;
  --gold:#B8892B;
  --danger:#A5311F;
  --radius: 6px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background: var(--shell);
  background-image:
    radial-gradient(circle at 15% 0%, rgba(184,137,43,0.08), transparent 40%),
    radial-gradient(circle at 90% 100%, rgba(47,107,94,0.10), transparent 45%);
  color: var(--ink);
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  padding: 28px 16px 60px;
}
.wrap{ max-width: 1150px; margin: 0 auto; }
.letterhead{
  background: var(--paper); border-radius: var(--radius); border: 1px solid var(--line);
  padding: 22px 26px; display:flex; align-items:center; justify-content:space-between; gap: 20px;
  box-shadow: 0 18px 40px -20px rgba(0,0,0,0.6); position:relative; overflow:hidden;
}
.letterhead::before{
  content:""; position:absolute; inset:0;
  background-image: repeating-linear-gradient(to bottom, transparent 0 27px, var(--line) 27px 28px);
  opacity:0.5; pointer-events:none;
}
.brandrow{ position:relative; z-index:1; }
.brand-input{
  font-family:'Special Elite', monospace; font-size: 26px; letter-spacing: 0.5px;
  background:transparent; border:none; color: var(--ink); border-bottom: 1px dashed transparent;
  padding: 2px 0; max-width: 420px;
}
.brand-input:focus{ outline:none; border-bottom-color: var(--stamp); }
.tagline{ font-size:12.5px; color: var(--ink-soft); margin-top:4px; text-transform:uppercase; letter-spacing:1.4px; }
.dateline{ font-family:'IBM Plex Mono', monospace; font-size:12px; color: var(--ink-soft); margin-top:2px; }
.stamp{
  position:relative; z-index:1; width: 78px; height: 78px; flex:0 0 auto;
  border: 3px solid var(--stamp); border-radius: 50%; display:flex; align-items:center; justify-content:center;
  transform: rotate(-9deg); color: var(--stamp); font-family:'Special Elite', monospace; text-align:center;
  font-size: 10.5px; line-height:1.25; letter-spacing:0.5px; opacity: 0.88; box-shadow: inset 0 0 0 1px var(--stamp);
}
.stats{ display:grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 14px; }
.stat{ background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.stat .label{ font-size:11px; text-transform:uppercase; letter-spacing:1px; color: var(--ink-soft); margin-bottom:6px;}
.stat .value{ font-family:'IBM Plex Mono', monospace; font-size:19px; font-weight:600; color: var(--ink);}
.stat.accent-jade .value{ color: var(--jade-dark); }
.stat.accent-gold .value{ color: #8a6821; }
.stat.accent-stamp .value{ color: var(--stamp-dark); }
.tabs{ display:flex; gap:4px; margin-top:22px; flex-wrap:wrap; border-bottom: 2px solid rgba(247,242,228,0.15); }
.tab{
  font-family:'Special Elite', monospace; font-size: 12.5px; letter-spacing:0.4px; background: transparent;
  color: rgba(247,242,228,0.55); border:none; padding: 10px 15px; cursor:pointer; border-bottom: 2px solid transparent;
  margin-bottom:-2px; transition: color .15s ease;
}
.tab:hover{ color: rgba(247,242,228,0.85); }
.tab.active{ color: #F7F2E4; border-bottom-color: var(--stamp); }
.panel{ background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px 24px 26px; min-height: 320px; }
.panel h2{ font-family:'Special Elite', monospace; font-size:16px; margin:0 0 4px; }
.panel .sub{ font-size:12.5px; color:var(--ink-soft); margin-bottom:18px;}
h3.section{ font-size:12px; text-transform:uppercase; letter-spacing:0.8px; color:var(--ink-soft); margin:18px 0 8px; border-top:1px dashed var(--line); padding-top:14px;}
h3.section:first-of-type{ border-top:none; padding-top:0; margin-top:6px; }
button{ font-family:'Inter',sans-serif; cursor:pointer; }
.btn{ background: var(--ink); color: var(--paper); border:none; border-radius:4px; padding: 9px 16px; font-size:13px; font-weight:600; letter-spacing:0.2px; }
.btn:hover{ opacity:0.88; }
.btn.ghost{ background:transparent; color:var(--ink); border:1px solid var(--line); }
.btn.stamp{ background: var(--stamp); color:#fff; }
.btn.jade{ background: var(--jade); color:#fff; }
.btn.small{ padding:5px 10px; font-size:11.5px; border-radius:3px; }
.btn.danger{ background:transparent; color: var(--danger); border:1px solid rgba(165,49,31,0.4); }
.row{ display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
.field{ display:flex; flex-direction:column; gap:4px; }
.field label{ font-size:11px; text-transform:uppercase; letter-spacing:0.6px; color:var(--ink-soft); }
.field input, .field select, .field textarea{
  font-family:'IBM Plex Mono', monospace; font-size:13px; padding: 8px 10px; border:1px solid var(--line);
  border-radius:4px; background:#fff; color: var(--ink); min-width: 110px;
}
.field textarea{ font-family:'Inter',sans-serif; min-width:220px; }
.field.grow{ flex:1; min-width:200px; }
.pair{ display:flex; gap:6px; }
.pair input{ width:100px; }
.pair select{ min-width:74px; }
.mode-toggle{ display:flex; gap:0; border:1px solid var(--line); border-radius:4px; overflow:hidden; }
.mode-toggle button{ border:none; background:#fff; padding:8px 14px; font-size:12px; color:var(--ink-soft); }
.mode-toggle button.on{ background:var(--ink); color:var(--paper); }
table{ width:100%; border-collapse:collapse; margin-top:16px; font-size:12.5px; }
thead th{ text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:0.6px; color: var(--ink-soft); border-bottom:1px solid var(--line); padding: 6px 8px; }
tbody td{ padding: 10px 8px; border-bottom:1px dashed var(--line); vertical-align:top; }
tbody tr:hover{ background: rgba(184,137,43,0.06); }
.mono{ font-family:'IBM Plex Mono', monospace; }
.muted{ color:var(--ink-soft); font-size:12px; }
.badge{ display:inline-block; padding:3px 9px; border-radius:20px; font-size:10.5px; font-weight:600; letter-spacing:0.3px; text-transform:uppercase; border:1px solid transparent; }
.badge.st-deposit{ background:rgba(165,49,31,0.10); color:var(--stamp-dark); border-color:rgba(165,49,31,0.25);}
.badge.st-ordered{ background:rgba(184,137,43,0.14); color:#7d5f1d; border-color:rgba(184,137,43,0.3);}
.badge.st-transit{ background:rgba(184,137,43,0.14); color:#7d5f1d; border-color:rgba(184,137,43,0.3);}
.badge.st-arrived{ background:rgba(47,107,94,0.10); color:var(--jade-dark); border-color:rgba(47,107,94,0.25);}
.badge.st-delivered{ background:rgba(47,107,94,0.18); color:var(--jade-dark); border-color:rgba(47,107,94,0.35);}
.badge.st-cancelled{ background:rgba(38,32,25,0.08); color:var(--ink-soft); border-color:var(--line);}
.card-empty{ padding: 34px 10px; text-align:center; color:var(--ink-soft); font-size:13px; border: 1px dashed var(--line); border-radius:var(--radius); margin-top:14px; }
.calc-grid{ display:grid; grid-template-columns: 1.3fr 1fr; gap:26px; margin-top:10px; }
@media (max-width: 760px){ .calc-grid{ grid-template-columns:1fr; } .stats{ grid-template-columns: 1fr 1fr; } }
.result{ background: var(--paper-2); border:1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; position:sticky; top:16px; }
.result .line{ display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px dashed var(--line); font-size:12.5px;}
.result .line:last-child{ border-bottom:none; }
.result .line.total{ font-weight:700; font-size:15px; padding-top:12px; }
.result .line .v{ font-family:'IBM Plex Mono', monospace; }
.toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background: var(--ink); color:var(--paper);
  padding:10px 18px; border-radius:5px; font-size:13px; opacity:0; pointer-events:none; transition: opacity .25s ease, transform .25s ease; z-index: 50; }
.toast.show{ opacity:1; transform:translateX(-50%) translateY(-4px); }
.icon-btn{ background:none; border:none; color:var(--ink-soft); font-size:14px; padding:2px 4px; }
.icon-btn:hover{ color: var(--stamp); }
.loading{ color: rgba(247,242,228,0.7); text-align:center; padding: 40px; font-family:'IBM Plex Mono', monospace; font-size:13px;}
.info-box{ background:rgba(47,107,94,0.08); border:1px solid rgba(47,107,94,0.25); border-radius:var(--radius); padding:14px 16px; font-size:12.5px; color:var(--jade-dark); margin-bottom:16px; }
.rate-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:12px; margin-top:8px; }
.rate-item{ background:#fff; border:1px solid var(--line); border-radius:4px; padding:10px 12px; }
.rate-item label{ font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; }
.rate-item input{ width:100%; margin-top:4px; }
.rate-note{ font-size:11px; color:var(--jade-dark); margin-top:4px; font-family:'IBM Plex Mono', monospace; }
.priced-note{ font-size:10.5px; color:var(--ink-soft); margin-top:2px; }
.cargo-list{ display:flex; flex-direction:column; gap:6px; margin-top:8px; }
.cargo-row{ display:flex; align-items:center; justify-content:space-between; background:#fff; border:1px solid var(--line); border-radius:4px; padding:8px 12px; font-size:12.5px; }
.mode-toggle button:disabled{ opacity:0.4; cursor:not-allowed; }
.hidden{ display:none !important; }
.login-wrap{ max-width: 380px; margin: 90px auto; }
.login-card{ background: var(--paper); border:1px solid var(--line); border-radius: var(--radius); padding: 30px 28px; box-shadow: 0 18px 40px -20px rgba(0,0,0,0.6); }
.login-card h1{ font-family:'Special Elite', monospace; font-size:20px; margin:0 0 4px; }
.login-card .sub{ font-size:12.5px; color:var(--ink-soft); margin-bottom:20px; }
.login-card .field{ margin-bottom:12px; }
.login-card .field input{ width:100%; }
.login-err{ color: var(--stamp-dark); font-size:12.5px; margin-top:10px; min-height:16px; }
.sync-pill{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; letter-spacing:0.4px; padding:3px 10px; border-radius:20px; display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); color:var(--ink-soft); background:var(--paper);}
.sync-pill .dot{ width:7px; height:7px; border-radius:50%; background:var(--ink-soft); }
.sync-pill.on .dot{ background: var(--jade); }
.sync-pill.err .dot{ background: var(--stamp); }
.sync-pill.busy .dot{ background: var(--gold); }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="loading">Opening the ledger…</div></div>
<div class="toast" id="toast"></div>

<script>
/* ---------------- firebase ---------------- */
const firebaseConfig = {
  apiKey: "AIzaSyCkMQAXomI2WosRseNgKuzozweso_tL8GY",
  authDomain: "ledgerforos.firebaseapp.com",
  projectId: "ledgerforos",
  storageBucket: "ledgerforos.firebasestorage.app",
  messagingSenderId: "888993672698",
  appId: "1:888993672698:web:c963c8adb851c6b7d48843"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
let CURRENT_UID = null;
const LISTENERS = [];

function setSyncPill(mode){
  const el = document.getElementById('syncPill');
  if(!el) return;
  el.className = 'sync-pill ' + mode;
  el.querySelector('.txt').textContent =
    mode==='on' ? 'Synced' : mode==='busy' ? 'Syncing…' : mode==='err' ? 'Sync error' : 'Offline';
}

/* ---------------- storage helpers (Firestore-backed) ---------------- */
function dataDoc(key){
  return db.collection('businesses').doc(CURRENT_UID).collection('data').doc(key);
}
async function sGet(key, fallback){
  try{
    const snap = await dataDoc(key).get();
    return snap.exists && snap.data().value !== undefined ? snap.data().value : fallback;
  }catch(e){ console.error('sGet failed', e); return fallback; }
}
async function sSet(key, value){
  try{
    setSyncPill('busy');
    await dataDoc(key).set({ value, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
    setSyncPill('on');
    return true;
  }catch(e){ console.error('storage set failed', e); setSyncPill('err'); return false; }
}
function watchKey(key, applyFn){
  const unsub = dataDoc(key).onSnapshot((snap)=>{
    if(!snap.exists) return;
    applyFn(snap.data().value);
    setSyncPill('on');
    render();
  }, (err)=>{ console.error('listener error', key, err); setSyncPill('err'); });
  LISTENERS.push(unsub);
}
function stopWatchers(){ LISTENERS.splice(0).forEach(u=>u()); }

/* ---------------- auth / login screen ---------------- */
function renderLogin(err){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="login-wrap">
      <div class="login-card">
        <h1>Ledger — Sign In</h1>
        <div class="sub">Shared account for this business. Use the same email &amp; password on both devices to see the same data.</div>
        <div class="field"><label>Email</label><input id="l_email" type="email" autocomplete="username"></div>
        <div class="field"><label>Password</label><input id="l_pass" type="password" autocomplete="current-password"></div>
        <div class="row"><button class="btn stamp" id="l_go" style="width:100%;">Sign In</button></div>
        <div class="login-err">${err?escapeHtml(err):''}</div>
      </div>
    </div>
  `;
  const go = async ()=>{
    const email = document.getElementById('l_email').value.trim();
    const pass = document.getElementById('l_pass').value;
    if(!email || !pass){ renderLogin('Enter both email and password.'); return; }
    try{
      document.getElementById('l_go').textContent = 'Signing in…';
      await auth.signInWithEmailAndPassword(email, pass);
    }catch(e){
      renderLogin(e.message || 'Sign in failed.');
    }
  };
  document.getElementById('l_go').addEventListener('click', go);
  document.getElementById('l_pass').addEventListener('keydown', (e)=>{ if(e.key==='Enter') go(); });
}
async function logout(){
  stopWatchers();
  await auth.signOut();
}
auth.onAuthStateChanged(async (user)=>{
  if(user){
    CURRENT_UID = user.uid;
    await init();
  } else {
    CURRENT_UID = null;
    stopWatchers();
    renderLogin();
  }
});

/* ---------------- state ---------------- */
const CURRENCIES = ['MMK','USD','THB','CNY','JPY','SGD'];
const CUR_LABEL = {MMK:'MMK (Kyat)', USD:'USD (US$)', THB:'THB (Baht)', CNY:'CNY (Yuan)', JPY:'JPY (Yen)', SGD:'SGD (S$)'};

let STATE = {
  orders: [], agents: [], products: [],
  settings: {
    businessName: 'My Shop',
    rates: { MMK:1, USD:2100, THB:60, CNY:290, JPY:14, SGD:1550 },
    marginPct: 25,
    cargoRates: [],
    lastUsed: {}
  }
};
let ACTIVE_TAB = 'dashboard';
const uid = () => Math.random().toString(36).slice(2,10);

function fmtMMK(n){ n = Math.round(n||0); return n.toLocaleString('en-US') + ' Ks'; }
function fmt2(n){ return (n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function toast(msg){
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._h); toast._h = setTimeout(()=> t.classList.remove('show'), 2400);
}
function escapeAttr(str){ return String(str||'').replace(/"/g,'&quot;'); }
function escapeHtml(str){ return String(str||'').replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

const STATUS_OPTS = [
  {v:'deposit', label:'Awaiting Deposit', cls:'st-deposit'},
  {v:'ordered', label:'Ordered w/ Agent', cls:'st-ordered'},
  {v:'transit', label:'In Transit', cls:'st-transit'},
  {v:'arrived', label:'Arrived in MM', cls:'st-arrived'},
  {v:'delivered', label:'Delivered & Paid', cls:'st-delivered'},
  {v:'cancelled', label:'Cancelled', cls:'st-cancelled'},
];
function statusMeta(v){ return STATUS_OPTS.find(s=>s.v===v) || STATUS_OPTS[0]; }

/* ---------------- currency + cost engine ---------------- */
function convert(amount, currency){
  const rate = STATE.settings.rates[currency];
  return (Number(amount)||0) * (rate!=null?rate:1);
}
function curPairHtml(prefix, amtVal, curVal){
  return `<div class="pair">
    <input id="${prefix}_amt" type="number" step="0.01" value="${amtVal||0}">
    <select id="${prefix}_cur">${CURRENCIES.map(c=>`<option value="${c}" ${c===curVal?'selected':''}>${c}</option>`).join('')}</select>
  </div>`;
}
function readPair(prefix){
  return { amt: parseFloat(document.getElementById(prefix+'_amt').value)||0, cur: document.getElementById(prefix+'_cur').value };
}
/* ---- cargo (per-KG) rates ---- */
function cargoRateOptions(selectedId){
  return (STATE.settings.cargoRates||[]).map(r=>`<option value="${r.id}" ${r.id===selectedId?'selected':''}>${escapeHtml(r.name)} — ${fmt2(r.amount)} ${r.currency}/kg</option>`).join('');
}
/* ---- shipping leg: flat amount OR weight × saved cargo rate ---- */
function shipLegHtml(prefix, key, label, leg){
  leg = leg || {};
  const mode = leg.mode || 'flat';
  const amt = leg.amt||0, cur = leg.cur||'MMK';
  const rates = STATE.settings.cargoRates||[];
  return `
    <div class="field grow">
      <label>${label}</label>
      <div class="mode-toggle" id="${prefix}_${key}_modeToggle">
        <button type="button" data-mode="flat" class="${mode==='flat'?'on':''}">Flat Amount</button>
        <button type="button" data-mode="weight" class="${mode==='weight'?'on':''}" ${rates.length?'':'disabled title="Add a cargo rate in Settings first"'}>By Weight (KG)</button>
      </div>
      <input type="hidden" id="${prefix}_${key}_mode" value="${mode}">
      <div id="${prefix}_${key}_flatWrap" class="${mode==='flat'?'':'hidden'}" style="margin-top:6px;">
        ${curPairHtml(prefix+'_'+key, amt, cur)}
      </div>
      <div id="${prefix}_${key}_weightWrap" class="${mode==='weight'?'':'hidden'}" style="margin-top:6px;">
        <div class="pair">
          <input id="${prefix}_${key}_kg" type="number" step="0.01" placeholder="Weight (kg)" value="${leg.weightKg||''}" style="width:100px;">
          <select id="${prefix}_${key}_rateId" style="min-width:180px;">
            <option value="">— choose rate —</option>
            ${cargoRateOptions(leg.cargoRateId)}
          </select>
        </div>
        <div class="rate-note" id="${prefix}_${key}_preview"></div>
      </div>
    </div>
  `;
}
function wireShipLeg(prefix, key, onChange){
  const toggle = document.getElementById(`${prefix}_${key}_modeToggle`);
  const setMode = (mode)=>{
    document.getElementById(`${prefix}_${key}_mode`).value = mode;
    toggle.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.mode===mode));
    document.getElementById(`${prefix}_${key}_flatWrap`).classList.toggle('hidden', mode!=='flat');
    document.getElementById(`${prefix}_${key}_weightWrap`).classList.toggle('hidden', mode!=='weight');
    if(onChange) onChange();
  };
  toggle.addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b || b.disabled) return; setMode(b.dataset.mode); });
  const kgInput = document.getElementById(`${prefix}_${key}_kg`);
  const rateSel = document.getElementById(`${prefix}_${key}_rateId`);
  const updatePreview = ()=>{
    const rate = (STATE.settings.cargoRates||[]).find(r=>r.id===rateSel.value);
    const kg = parseFloat(kgInput.value)||0;
    const prev = document.getElementById(`${prefix}_${key}_preview`);
    if(rate && kg){ prev.textContent = `= ${fmt2(kg*rate.amount)} ${rate.currency}`; } else { prev.textContent=''; }
  };
  kgInput.addEventListener('input', ()=>{ updatePreview(); if(onChange) onChange(); });
  rateSel.addEventListener('change', ()=>{ updatePreview(); if(onChange) onChange(); });
  updatePreview();
}
function readShipLeg(prefix, key){
  const mode = document.getElementById(`${prefix}_${key}_mode`).value;
  if(mode==='weight'){
    const rateId = document.getElementById(`${prefix}_${key}_rateId`).value;
    const rate = (STATE.settings.cargoRates||[]).find(r=>r.id===rateId);
    const kg = parseFloat(document.getElementById(`${prefix}_${key}_kg`).value)||0;
    return { mode:'weight', weightKg:kg, cargoRateId:rateId, amt: rate? kg*rate.amount : 0, cur: rate? rate.currency : 'MMK' };
  }
  const p = readPair(prefix+'_'+key);
  return { mode:'flat', amt:p.amt, cur:p.cur, weightKg:0, cargoRateId:'' };
}
// f = {unitCost:{amt,cur}, qty, intl:{amt,cur,mode,weightKg,cargoRateId}, agentMode, agentPct, agentFlat:{amt,cur}, domestic:{...}, lastMile:{...}}
function computeLanded(f){
  const itemMMK = convert(f.unitCost.amt, f.unitCost.cur) * (f.qty||1);
  const intlMMK = convert(f.intl.amt, f.intl.cur);
  const domMMK = convert(f.domestic.amt, f.domestic.cur);
  const lastMMK = convert(f.lastMile.amt, f.lastMile.cur);
  const feeBase = itemMMK + intlMMK;
  const agentMMK = f.agentMode==='flat' ? convert(f.agentFlat.amt, f.agentFlat.cur) : feeBase*(Number(f.agentPct)||0)/100;
  const landed = itemMMK+intlMMK+domMMK+lastMMK+agentMMK;
  return {itemMMK, intlMMK, domMMK, lastMMK, agentMMK, landed};
}
// sell price for one unit, from a per-unit landed cost and the item's margin settings
function computeSell(perUnitLanded, f){
  if(f.marginMode==='flat') return perUnitLanded + (Number(f.marginFlatMMK)||0);
  return perUnitLanded*(1+(Number(f.marginPct)||0)/100);
}

    </div>
    <h3 class="section">Shipping Legs</h3>
    <div class="row">

    </div>
    <h3 class="section">Agent Fee</h3>

      <div class="field"><label>Fee Type</label>

      <div class="field ${agentMode==='flat'?'':'hidden'}" id="${prefix}_agentFlatWrap"><label>Flat Fee</label>${curPairHtml(prefix+'_agentFlat', agentFlat.amt, agentFlat.cur)}</div>
    </div>

      <div class="field"><label>Margin Type</label>
        <div class="mode-toggle" id="${prefix}_marginModeToggle">
          <button type="button" data-mode="percent" class="${marginMode==='percent'?'on':''}">% Margin</button>
          <button type="button" data-mode="flat" class="${marginMode==='flat'?'on':''}">+ Fixed Profit (Ks)</button>
        </div>
        <input type="hidden" id="${prefix}_marginMode" value="${marginMode}">
      </div>
      <div class="field ${marginMode==='percent'?'':'hidden'}" id="${prefix}_marginPctWrap"><label>Margin %</label><input id="${prefix}_margin" type="number" value="${f.marginPct!=null?f.marginPct:STATE.settings.marginPct}" style="width:90px;"></div>
      <div class="field ${marginMode==='flat'?'':'hidden'}" id="${prefix}_marginFlatWrap"><label>Profit / Unit (Ks)</label><input id="${prefix}_marginFlat" type="number" value="${f.marginFlatMMK||0}" style="width:120px;"></div>

function wireCostForm(prefix, onRecalc){
  const toggle = document.getElementById(prefix+'_agentModeToggle');
  toggle.addEventListener('click', (e)=>{
    const b = e.target.closest('button'); if(!b) return;
    const mode = b.dataset.mode;
    document.getElementById(prefix+'_agentMode').value = mode;
    toggle.querySelectorAll('button').forEach(x=>x.classList.toggle('on', x.dataset.mode===mode));
    document.getElementById(prefix+'_agentPctWrap').classList.toggle('hidden', mode!=='percent');
    document.getElementById(prefix+'_agentFlatWrap').classList.toggle('hidden', mode!=='flat');
  });
  const marginToggle = document.getElementById(prefix+'_marginModeToggle');
  marginToggle.addEventListener('click', (e)=>{
    const b = e.target.closest('button'); if(!b) return;
    const mode = b.dataset.mode;
    document.getElementById(prefix+'_marginMode').value = mode;
    marginToggle.querySelectorAll('button').forEach(x=>x.classList.toggle('on', x.dataset.mode===mode));
    document.getElementById(prefix+'_marginPctWrap').classList.toggle('hidden', mode!=='percent');
    document.getElementById(prefix+'_marginFlatWrap').classList.toggle('hidden', mode!=='flat');
  });
  wireShipLeg(prefix, 'intl', onRecalc);
  wireShipLeg(prefix, 'dom', onRecalc);
  wireShipLeg(prefix, 'last', onRecalc);
  document.getElementById(prefix+'_recalc').addEventListener('click', onRecalc);
}
function readCostForm(prefix){
  return {
    unitCost: readPair(prefix+'_uc'),
    qty: parseFloat(document.getElementById(prefix+'_qty').value)||1,
    intl: readShipLeg(prefix, 'intl'),
    domestic: readShipLeg(prefix, 'dom'),
    lastMile: readShipLeg(prefix, 'last'),
    agentMode: document.getElementById(prefix+'_agentMode').value,
    agentPct: parseFloat(document.getElementById(prefix+'_agentPct').value)||0,
    agentFlat: readPair(prefix+'_agentFlat'),
    marginMode: document.getElementById(prefix+'_marginMode').value,
    marginPct: parseFloat(document.getElementById(prefix+'_margin').value)||0,
    marginFlatMMK: parseFloat(document.getElementById(prefix+'_marginFlat').value)||0
  };
}
/* ---- remember last-used choices so new items start where you left off ---- */
function lastUsedCost(){
  const lu = STATE.settings.lastUsed || {};
  return {
    unitCost:{amt:0, cur: lu.uc_cur || 'USD'},
    qty:1,
    intl:{mode: lu.intl_mode||'flat', amt:0, cur: lu.intl_cur||'USD', weightKg:0, cargoRateId: lu.intl_cargoRateId||''},
    domestic:{mode: lu.dom_mode||'flat', amt:0, cur: lu.dom_cur||'MMK', weightKg:0, cargoRateId: lu.dom_cargoRateId||''},
    lastMile:{mode: lu.last_mode||'flat', amt:0, cur: lu.last_cur||'MMK', weightKg:0, cargoRateId: lu.last_cargoRateId||''},
    agentMode: lu.agentMode || 'percent',
    agentPct: lu.agentPct!=null ? lu.agentPct : 0,
    agentFlat:{amt:0, cur: lu.agentFlat_cur||'THB'},
    marginMode: lu.marginMode || 'percent',
    marginPct: STATE.settings.marginPct,
    marginFlatMMK: lu.marginFlatMMK||0
  };
}
function rememberLastUsed(cost, agentId){
  const lu = Object.assign({}, STATE.settings.lastUsed||{});
  lu.uc_cur = cost.unitCost.cur;
  lu.intl_mode = cost.intl.mode; lu.intl_cur = cost.intl.cur; lu.intl_cargoRateId = cost.intl.cargoRateId;
  lu.dom_mode = cost.domestic.mode; lu.dom_cur = cost.domestic.cur; lu.dom_cargoRateId = cost.domestic.cargoRateId;
  lu.last_mode = cost.lastMile.mode; lu.last_cur = cost.lastMile.cur; lu.last_cargoRateId = cost.lastMile.cargoRateId;
  lu.agentMode = cost.agentMode; lu.agentPct = cost.agentPct; lu.agentFlat_cur = cost.agentFlat.cur;
  lu.marginMode = cost.marginMode; lu.marginFlatMMK = cost.marginFlatMMK;
  if(agentId!=null && agentId!=='') lu.agentId = agentId;
  STATE.settings.lastUsed = lu;
  sSet('settings', STATE.settings);
}

/* ---------------- init ---------------- */
async function init(){
  document.getElementById('app').innerHTML = '<div class="loading">Opening the ledger…</div>';
  const [orders, agents, products, settings] = await Promise.all([
    sGet('orders', []), sGet('agents', []), sGet('products', []), sGet('settings', STATE.settings)
  ]);
  STATE.orders = orders; STATE.agents = agents; STATE.products = products;
  STATE.settings = Object.assign({}, STATE.settings, settings, {rates: Object.assign({}, STATE.settings.rates, (settings&&settings.rates)||{})});
  render();

  stopWatchers();
  watchKey('orders', v=>{ STATE.orders = v||[]; });
  watchKey('agents', v=>{ STATE.agents = v||[]; });
  watchKey('products', v=>{ STATE.products = v||[]; });
  watchKey('settings', v=>{ STATE.settings = Object.assign({}, STATE.settings, v||{}, {rates: Object.assign({}, STATE.settings.rates, (v&&v.rates)||{})}); });
}

/* ---------------- render root ---------------- */
function render(){
  const app = document.getElementById('app');
  const s = STATE.settings;
  const active = STATE.orders.filter(o=>o.status!=='cancelled');
  const depositsCollected = active.reduce((a,o)=>a+Number(o.depositMMK||0),0);
  const balanceOwed = active.filter(o=>o.status!=='delivered').reduce((a,o)=>a+Math.max(0,orderSellMMK(o)-Number(o.depositMMK||0)),0);
  const landedCommitted = active.filter(o=>o.status!=='delivered').reduce((a,o)=>a+orderLandedMMK(o),0);
  const estProfit = active.reduce((a,o)=>a+(orderSellMMK(o)-orderLandedMMK(o)),0);

  app.innerHTML = `
    <div class="letterhead">
      <div class="brandrow">
        <input class="brand-input" id="bizName" value="${escapeAttr(s.businessName)}" />
        <div class="tagline">Order &amp; Cash Ledger</div>
        <div class="dateline">${new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})} · 1 USD ≈ ${s.rates.USD.toLocaleString()} Ks</div>
      </div>
      <div style="position:relative; z-index:1; display:flex; flex-direction:column; align-items:flex-end; gap:8px;">
        <div class="sync-pill on" id="syncPill"><span class="dot"></span><span class="txt">Synced</span></div>
        <button class="btn ghost small" id="logoutBtn" type="button">Sign out</button>
      </div>
      <div class="stamp">PAID<br>&amp; SEALED<br>★ ★ ★</div>
    </div>
    <div class="stats">
      <div class="stat accent-jade"><div class="label">Deposits Collected</div><div class="value">${fmtMMK(depositsCollected)}</div></div>
      <div class="stat accent-gold"><div class="label">Balance Owed by Customers</div><div class="value">${fmtMMK(balanceOwed)}</div></div>
      <div class="stat accent-stamp"><div class="label">Cost Committed (Active)</div><div class="value">${fmtMMK(landedCommitted)}</div></div>
      <div class="stat"><div class="label">Est. Profit (all active)</div><div class="value">${fmtMMK(estProfit)}</div></div>
    </div>
    <div class="tabs" id="tabs">
      ${tabBtn('dashboard','Dashboard')}${tabBtn('orders','Orders')}${tabBtn('products','Products')}
      ${tabBtn('pricing','Pricing Calculator')}${tabBtn('agents','Agents')}${tabBtn('settings','Settings')}${tabBtn('data','Data & Backup')}
    </div>
    <div class="panel" id="panel"></div>
  `;
  document.getElementById('bizName').addEventListener('change', async (e)=>{
    STATE.settings.businessName = e.target.value || 'My Shop';
    await sSet('settings', STATE.settings);
  });
  document.getElementById('tabs').addEventListener('click', (e)=>{
    const b = e.target.closest('.tab'); if(!b) return;
    ACTIVE_TAB = b.dataset.tab; render();
  });
  document.getElementById('logoutBtn').addEventListener('click', logout);
  renderPanel();
}
function tabBtn(id,label){ return `<button class="tab ${ACTIVE_TAB===id?'active':''}" data-tab="${id}">${label}</button>`; }

function orderLandedMMK(o){
  if(o.mode==='catalog') return (o.snapLandedMMK||0)*(o.qty||1);
  return computeLanded(o.cost).landed;
}
function orderSellMMK(o){
  if(o.mode==='catalog') return (o.snapSellMMK||0)*(o.qty||1);
  return Number(o.sellPriceMMK||0);
}

/* ---------------- panel router ---------------- */
function renderPanel(){
  const panel = document.getElementById('panel');
  if(ACTIVE_TAB==='dashboard') return renderDashboard(panel);
  if(ACTIVE_TAB==='orders') return renderOrders(panel);
  if(ACTIVE_TAB==='products') return renderProducts(panel);
  if(ACTIVE_TAB==='pricing') return renderPricing(panel);
  if(ACTIVE_TAB==='agents') return renderAgents(panel);
  if(ACTIVE_TAB==='settings') return renderSettings(panel);
  if(ACTIVE_TAB==='data') return renderData(panel);
}

/* ---------------- dashboard ---------------- */
function renderDashboard(panel){
  const counts = {}; STATUS_OPTS.forEach(s=>counts[s.v]=0);
  STATE.orders.forEach(o=> counts[o.status] = (counts[o.status]||0)+1 );
  const recent = [...STATE.orders].sort((a,b)=> (b.orderDate||'').localeCompare(a.orderDate||'')).slice(0,6);
  panel.innerHTML = `
    <h2>Dashboard</h2>
    <div class="sub">A quick read of where cash and stock currently stand.</div>
    <div class="row" style="gap:8px; margin-bottom:18px;">
      ${STATUS_OPTS.map(s=>`<span class="badge ${s.cls}">${s.label}: ${counts[s.v]||0}</span>`).join('')}
    </div>
    ${recent.length ? `
      <table><thead><tr><th>Customer</th><th>Product</th><th>Status</th><th>Sell Price</th><th>Balance Due</th></tr></thead>
      <tbody>${recent.map(o=>`
        <tr><td>${escapeHtml(o.customer)||'—'}</td><td>${escapeHtml(o.product)||'—'}</td>
        <td><span class="badge ${statusMeta(o.status).cls}">${statusMeta(o.status).label}</span></td>
        <td class="mono">${fmtMMK(orderSellMMK(o))}</td>
        <td class="mono">${fmtMMK(Math.max(0,orderSellMMK(o)-Number(o.depositMMK||0)))}</td></tr>
      `).join('')}</tbody></table>
    ` : `<div class="card-empty">No orders yet. Go to the Orders tab to log your first customer order.</div>`}
  `;
}

/* ---------------- orders ---------------- */
function blankOrder(){
  return { id: uid(), mode:'catalog', productId:'', customer:'', phone:'', product:'', qty:1,
    snapLandedMMK:0, snapSellMMK:0,
    cost: lastUsedCost(),
    sellPriceMMK:0, depositMMK:0, status:'deposit', agentId: (STATE.settings.lastUsed||{}).agentId||'', orderDate: new Date().toISOString().slice(0,10), notes:'' };
}
function renderOrders(panel){
  panel.innerHTML = `
    <h2>Orders</h2>
    <div class="sub">Every customer order lives here — deposit, cost, status, balance due.</div>
    <div class="row" style="margin-bottom:6px;"><button class="btn stamp small" id="newOrderBtn">+ New Order</button></div>
    <div id="orderFormHolder"></div>
    ${STATE.orders.length ? renderOrdersTable() : `<div class="card-empty">No orders logged yet.</div>`}
  `;
  document.getElementById('newOrderBtn').addEventListener('click', ()=> showOrderForm(blankOrder()));
  wireOrderTableEvents();
}
function renderOrdersTable(){
  const rows = [...STATE.orders].sort((a,b)=>(b.orderDate||'').localeCompare(a.orderDate||''));
  return `<table><thead><tr><th>Date</th><th>Customer</th><th>Product</th><th>Qty</th><th>Landed Cost</th><th>Sell Price</th><th>Deposit</th><th>Balance</th><th>Status</th><th>Agent</th><th></th></tr></thead>
    <tbody>${rows.map(o=>{
      const agent = STATE.agents.find(a=>a.id===o.agentId);
      const bal = Math.max(0, orderSellMMK(o)-Number(o.depositMMK||0));
      return `<tr data-id="${o.id}">
        <td class="muted mono">${o.orderDate||''}</td>
        <td>${escapeHtml(o.customer)||'—'}<br><span class="muted">${escapeHtml(o.phone)||''}</span></td>
        <td>${escapeHtml(o.product)||'—'}</td>
        <td class="mono">${o.qty||1}</td>
        <td class="mono">${fmtMMK(orderLandedMMK(o))}</td>
        <td class="mono">${fmtMMK(orderSellMMK(o))}</td>
        <td class="mono">${fmtMMK(o.depositMMK)}</td>
        <td class="mono">${fmtMMK(bal)}</td>
        <td><span class="badge ${statusMeta(o.status).cls}">${statusMeta(o.status).label}</span></td>
        <td class="muted">${agent?escapeHtml(agent.name):'—'}</td>
        <td><button class="icon-btn edit-order" title="Edit">✎</button><button class="icon-btn del-order" title="Delete">✕</button></td>
      </tr>`;
    }).join('')}</tbody></table>`;
}
function wireOrderTableEvents(){
  document.querySelectorAll('.edit-order').forEach(btn=>{
    btn.addEventListener('click', (e)=>{ const id = e.target.closest('tr').dataset.id; const o = STATE.orders.find(x=>x.id===id); if(o) showOrderForm(o); });
  });
  document.querySelectorAll('.del-order').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      const id = e.target.closest('tr').dataset.id;
      if(!confirm('Delete this order? This cannot be undone.')) return;
      STATE.orders = STATE.orders.filter(o=>o.id!==id);
      await sSet('orders', STATE.orders); toast('Order deleted');
      renderOrders(document.getElementById('panel')); render();
    });
  });
}
function showOrderForm(o){
  const holder = document.getElementById('orderFormHolder');
  const agentOpts = STATE.agents.map(a=>`<option value="${a.id}" ${o.agentId===a.id?'selected':''}>${escapeHtml(a.name)}</option>`).join('');
  const prodOpts = STATE.products.map(p=>`<option value="${p.id}" ${o.productId===p.id?'selected':''}>${escapeHtml(p.name)} ${p.code?'('+escapeHtml(p.code)+')':''} — ${fmtMMK(p.sellPriceMMK)}</option>`).join('');
  holder.innerHTML = `
    <div class="panel" style="background:var(--paper-2); margin-bottom:16px;">
      <h2 style="margin-bottom:14px;">${STATE.orders.find(x=>x.id===o.id)?'Edit Order':'New Order'}</h2>
      <div class="field"><label>Item Source</label>
        <div class="mode-toggle" id="ordModeToggle">
          <button type="button" data-mode="catalog" class="${o.mode==='catalog'?'on':''}">From Product Catalog</button>
          <button type="button" data-mode="custom" class="${o.mode==='custom'?'on':''}">Custom / One-off Item</button>
        </div>
      </div>
      <div id="ordCatalogWrap" class="${o.mode==='catalog'?'':'hidden'}" style="margin-top:12px;">
        ${STATE.products.length ? `
          <div class="field grow"><label>Select Product</label><select id="f_productId"><option value="">— choose —</option>${prodOpts}</select></div>
        ` : `<div class="card-empty">No products saved yet. Add one in the Products tab, or switch to Custom / One-off Item.</div>`}
      </div>
      <div id="ordCustomWrap" class="${o.mode==='custom'?'':'hidden'}" style="margin-top:6px;">
        <div class="row"><div class="field grow"><label>Product / Item Name</label><input id="f_productName" value="${escapeAttr(o.product)}"></div></div>
        ${costFormHtml('ordc', o.cost)}
        <div class="row"><div class="field"><label>Sell Price (MMK)</label><input id="ordc_sell" type="number" value="${o.sellPriceMMK||0}" style="width:150px;"></div></div>
      </div>
      <h3 class="section">Customer</h3>
      <div class="row">
        <div class="field"><label>Customer Name</label><input id="f_customer" value="${escapeAttr(o.customer)}"></div>
        <div class="field"><label>Phone</label><input id="f_phone" value="${escapeAttr(o.phone)}"></div>
        <div class="field"><label>Qty</label><input id="f_qty" type="number" min="1" value="${o.qty||1}" style="width:80px;"></div>
        <div class="field"><label>Deposit Paid (MMK)</label><input id="f_deposit" type="number" value="${o.depositMMK||0}" style="width:140px;"></div>
      </div>
      <div class="row" style="margin-top:10px;">
        <div class="field"><label>Status</label><select id="f_status">${STATUS_OPTS.map(s=>`<option value="${s.v}" ${o.status===s.v?'selected':''}>${s.label}</option>`).join('')}</select></div>
        <div class="field"><label>Agent</label><select id="f_agent"><option value="">—</option>${agentOpts}</select></div>
        <div class="field"><label>Order Date</label><input id="f_date" type="date" value="${o.orderDate}"></div>
      </div>
      <div class="row" style="margin-top:10px;"><div class="field grow"><label>Notes</label><textarea id="f_notes" rows="2">${escapeHtml(o.notes)}</textarea></div></div>
      <div class="row" style="margin-top:16px;"><button class="btn stamp" id="f_save">Save Order</button><button class="btn ghost" id="f_cancel">Cancel</button></div>
    </div>
  `;
  document.getElementById('f_agent').value = o.agentId||'';

  document.getElementById('ordModeToggle').addEventListener('click',(e)=>{
    const b = e.target.closest('button'); if(!b) return;
    const mode = b.dataset.mode; o.mode = mode;
    document.getElementById('ordModeToggle').querySelectorAll('button').forEach(x=>x.classList.toggle('on', x.dataset.mode===mode));
    document.getElementById('ordCatalogWrap').classList.toggle('hidden', mode!=='catalog');
    document.getElementById('ordCustomWrap').classList.toggle('hidden', mode!=='custom');
  });

  if(o.mode==='custom' || !STATE.products.length){
    wireCostForm('ordc', ()=>{
      const f = readCostForm('ordc'); const r = computeLanded(f);
      const perUnit = r.landed/(f.qty||1);
      document.getElementById('ordc_sell').value = Math.round(computeSell(perUnit, f)*(f.qty||1));
    });
  }

  document.getElementById('f_cancel').addEventListener('click', ()=>{ holder.innerHTML=''; });
  document.getElementById('f_save').addEventListener('click', async ()=>{
    const mode = document.querySelector('#ordModeToggle button.on').dataset.mode;
    const base = {
      id:o.id, mode, customer: document.getElementById('f_customer').value.trim(),
      phone: document.getElementById('f_phone').value.trim(),
      qty: parseFloat(document.getElementById('f_qty').value)||1,
      depositMMK: parseFloat(document.getElementById('f_deposit').value)||0,
      status: document.getElementById('f_status').value,
      agentId: document.getElementById('f_agent').value,
      orderDate: document.getElementById('f_date').value,
      notes: document.getElementById('f_notes').value.trim()
    };
    let updated;
    if(mode==='catalog'){
      const pid = document.getElementById('f_productId') ? document.getElementById('f_productId').value : '';
      const p = STATE.products.find(x=>x.id===pid);
      if(!p){ toast('Choose a product, or switch to Custom item'); return; }
      updated = Object.assign({}, base, { productId:p.id, product:p.name, snapLandedMMK:p.landedCostMMK, snapSellMMK:p.sellPriceMMK, cost:o.cost, sellPriceMMK:0 });
    } else {
      const name = document.getElementById('f_productName').value.trim();
      if(!name){ toast('Item name required'); return; }
      const cost = readCostForm('ordc');
      cost.ratesSnapshot = Object.assign({}, STATE.settings.rates);
      cost.pricedAt = new Date().toISOString().slice(0,10);
      const sell = parseFloat(document.getElementById('ordc_sell').value)||0;
      updated = Object.assign({}, base, { productId:'', product:name, cost, sellPriceMMK: sell, snapLandedMMK:0, snapSellMMK:0 });
    }
    if(!updated.customer){ toast('Customer name required'); return; }
    rememberLastUsed(updated.cost, updated.agentId);
    const idx = STATE.orders.findIndex(x=>x.id===o.id);
    if(idx>=0) STATE.orders[idx]=updated; else STATE.orders.push(updated);
    await sSet('orders', STATE.orders); toast('Order saved'); holder.innerHTML='';
    renderOrders(document.getElementById('panel')); render();
  });
}

          <td>${escapeHtml(p.name)}</td>
          <td class="muted">${escapeHtml(p.category)||'—'}</td>
          <td class="mono">${fmtMMK(p.landedCostMMK)}${p.cost&&p.cost.pricedAt?`<div class="priced-note">as of ${p.cost.pricedAt}</div>`:''}</td>
          <td class="mono">${fmtMMK(p.sellPriceMMK)}</td>
          <td class="muted">${escapeHtml(p.notes)||''}</td>
          <td><button class="icon-btn refresh-prod" title="Reprice with today's exchange rate">↻</button><button class="icon-btn edit-prod" title="Edit">✎</button><button class="icon-btn del-prod" title="Delete">✕</button></td>
        </tr>`).join('')}</tbody></table>
    ` : `<div class="card-empty">No products saved yet.</div>`}
  `;
  document.getElementById('newProdBtn').addEventListener('click', ()=> showProductForm(blankProduct()));
  document.querySelectorAll('.edit-prod').forEach(btn=>{
    btn.addEventListener('click', e=>{ const id=e.target.closest('tr').dataset.id; const p=STATE.products.find(x=>x.id===id); if(p) showProductForm(p); });
  });
  document.querySelectorAll('.refresh-prod').forEach(btn=>{
    btn.addEventListener('click', e=>{ const id=e.target.closest('tr').dataset.id; refreshProductRate(id); });
  });
  document.querySelectorAll('.del-prod').forEach(btn=>{
    btn.addEventListener('click', async e=>{
      const id=e.target.closest('tr').dataset.id;
      if(!confirm('Delete this product from the catalog?')) return;
      STATE.products = STATE.products.filter(p=>p.id!==id);
      await sSet('products', STATE.products); toast('Product deleted');
      renderProducts(document.getElementById('panel'));
    });
  });
}
function showProductForm(p){
  const holder = document.getElementById('prodFormHolder');
  holder.innerHTML = `
    <div class="panel" style="background:var(--paper-2); margin-bottom:16px;">
      <div class="row">
        <div class="field"><label>Item Code / SKU</label><input id="p_code" value="${escapeAttr(p.code)}" style="width:120px;"></div>
        <div class="field grow"><label>Item Name</label><input id="p_name" value="${escapeAttr(p.name)}"></div>
        <div class="field"><label>Category</label><input id="p_category" value="${escapeAttr(p.category)}" style="width:140px;"></div>
      </div>
      ${costFormHtml('pc', p.cost)}
      <div class="row"><div class="field"><label>Sell Price (MMK)</label><input id="pc_sell" type="number" value="${p.sellPriceMMK||0}" style="width:150px;"></div></div>
      <div class="row" style="margin-top:10px;"><div class="field grow"><label>Notes</label><textarea id="p_notes" rows="2">${escapeHtml(p.notes)}</textarea></div></div>
      <div class="row" style="margin-top:16px;"><button class="btn stamp" id="p_save">Save Product</button><button class="btn ghost" id="p_cancel">Cancel</button></div>
    </div>
  `;
  wireCostForm('pc', ()=>{
    const f = readCostForm('pc'); const r = computeLanded(f);
    const perUnit = r.landed/(f.qty||1);
    document.getElementById('pc_sell').value = Math.round(computeSell(perUnit, f));
  });
  document.getElementById('p_cancel').addEventListener('click', ()=> holder.innerHTML='');
  document.getElementById('p_save').addEventListener('click', async ()=>{
    const name = document.getElementById('p_name').value.trim();
    if(!name){ toast('Item name required'); return; }
    const cost = readCostForm('pc');
    const r = computeLanded(cost);
    const perUnitLanded = r.landed/(cost.qty||1);
    cost.ratesSnapshot = Object.assign({}, STATE.settings.rates);
    cost.pricedAt = new Date().toISOString().slice(0,10);
    const updated = {
      id:p.id, code: document.getElementById('p_code').value.trim(), name, category: document.getElementById('p_category').value.trim(),
      notes: document.getElementById('p_notes').value.trim(), cost,
      landedCostMMK: perUnitLanded, sellPriceMMK: parseFloat(document.getElementById('pc_sell').value)||0
    };
    rememberLastUsed(cost, null);
    const idx = STATE.products.findIndex(x=>x.id===p.id);
    if(idx>=0) STATE.products[idx]=updated; else STATE.products.push(updated);
    await sSet('products', STATE.products); toast('Product saved to catalog'); holder.innerHTML='';
    renderProducts(document.getElementById('panel'));
  });
}
async function refreshProductRate(id){
  const p = STATE.products.find(x=>x.id===id); if(!p) return;
  const r = computeLanded(p.cost);
  const perUnitLanded = r.landed/(p.cost.qty||1);
  const sell = computeSell(perUnitLanded, p.cost);
  p.landedCostMMK = perUnitLanded;
  p.sellPriceMMK = sell;
  p.cost = Object.assign({}, p.cost, { ratesSnapshot: Object.assign({}, STATE.settings.rates), pricedAt: new Date().toISOString().slice(0,10) });
  await sSet('products', STATE.products);
  toast('Repriced with today\'s exchange rate');
  renderProducts(document.getElementById('panel'));
}

/* ---------------- pricing calculator (scratchpad) ---------------- */
function renderPricing(panel){
  panel.innerHTML = `
    <h2>Pricing Calculator</h2>
    <div class="sub">A scratchpad for "what if" pricing. Save the result straight to Products when you're happy with it — no need to redo the math on the order form later.</div>
    <div class="calc-grid">
      <div>${costFormHtml('calc', null)}
        <div class="row" style="margin-top:6px;"><div class="field grow"><label>Save as Product — Name</label><input id="calc_name" placeholder="e.g. Rhode Peptide Lip Tint"></div>
        <div class="field"><label>Code</label><input id="calc_code" style="width:110px;"></div></div>
        <div class="row" style="margin-top:14px;"><button class="btn jade" id="calc_saveProd">Save as Product →</button></div>
      </div>
      <div class="result" id="calc_result">
        <div class="line"><span>Item Cost</span><span class="v">—</span></div>
        <div class="line"><span>International Shipping</span><span class="v">—</span></div>
        <div class="line"><span>Domestic Transfer</span><span class="v">—</span></div>
        <div class="line"><span>Last-Mile Delivery</span><span class="v">—</span></div>
        <div class="line"><span>Agent Fee</span><span class="v">—</span></div>
        <div class="line"><span>Landed Cost (per unit)</span><span class="v">—</span></div>
        <div class="line total"><span>Suggested Price</span><span class="v">—</span></div>
        <div class="line"><span>Profit per Unit</span><span class="v">—</span></div>
      </div>
    </div>
  `;
  const calc = ()=>{
    const f = readCostForm('calc'); const r = computeLanded(f);
    const perUnitLanded = r.landed/(f.qty||1);
    const price = computeSell(perUnitLanded, f);
    document.getElementById('calc_result').innerHTML = `
      <div class="line"><span>Item Cost</span><span class="v">${fmtMMK(r.itemMMK)}</span></div>
      <div class="line"><span>International Shipping</span><span class="v">${fmtMMK(r.intlMMK)}</span></div>
      <div class="line"><span>Domestic Transfer</span><span class="v">${fmtMMK(r.domMMK)}</span></div>
      <div class="line"><span>Last-Mile Delivery</span><span class="v">${fmtMMK(r.lastMMK)}</span></div>
      <div class="line"><span>Agent Fee</span><span class="v">${fmtMMK(r.agentMMK)}</span></div>
      <div class="line"><span>Landed Cost (per unit)</span><span class="v">${fmtMMK(perUnitLanded)}</span></div>
      <div class="line total"><span>Suggested Price</span><span class="v">${fmtMMK(price)}</span></div>
      <div class="line"><span>Profit per Unit</span><span class="v">${fmtMMK(price-perUnitLanded)}</span></div>
    `;
    return {perUnitLanded, price};
  };
  wireCostForm('calc', calc);
  calc();
  document.getElementById('calc_saveProd').addEventListener('click', async ()=>{
    const name = document.getElementById('calc_name').value.trim();
    if(!name){ toast('Give the product a name first'); return; }
    const f = readCostForm('calc'); const res = calc();
    f.ratesSnapshot = Object.assign({}, STATE.settings.rates);
    f.pricedAt = new Date().toISOString().slice(0,10);
    const product = { id:uid(), code: document.getElementById('calc_code').value.trim(), name, category:'', notes:'',
      cost:f, landedCostMMK: res.perUnitLanded, sellPriceMMK: res.price };
    STATE.products.push(product);
    rememberLastUsed(f, null);
    await sSet('products', STATE.products);
    toast('Saved to Products — find it under the Products tab');
  });
}

/* ---------------- agents ---------------- */

    <h2>Agents / Suppliers</h2>
    <div class="sub">Whoever buys and ships on your behalf overseas.</div>
    <div class="row" style="margin-bottom:6px;"><button class="btn stamp small" id="newAgentBtn">+ New Agent</button></div>
    <div id="agentFormHolder"></div>
    ${STATE.agents.length ? `
      <table><thead><tr><th>Name</th><th>Contact</th><th>Location</th><th>Notes</th><th></th></tr></thead>
      <tbody>${STATE.agents.map(a=>`
        <tr data-id="${a.id}"><td>${escapeHtml(a.name)}</td><td class="muted">${escapeHtml(a.contact)}</td>

/* ---------------- settings ---------------- */
function renderSettings(panel){
  const s = STATE.settings;
  panel.innerHTML = `
    <h2>Settings</h2>
    <div class="sub">Defaults used across new orders, products, and the pricing calculator.</div>
    <div class="row"><div class="field"><label>Business Name</label><input id="s_name" value="${escapeAttr(s.businessName)}"></div>
    <div class="field"><label>Default Margin %</label><input id="s_margin" type="number" value="${s.marginPct}" style="width:100px;"></div></div>
    <h3 class="section">Exchange Rates (1 unit = ? MMK)</h3>
    <div class="sub" style="margin-top:-6px;">Change these any time — new orders and products price off whatever is here today. Existing items keep the rate they were priced at until you reprice them.</div>
    <div class="rate-grid">
      ${CURRENCIES.filter(c=>c!=='MMK').map(c=>`
        <div class="rate-item"><label>${CUR_LABEL[c]}</label><input id="rate_${c}" type="number" value="${s.rates[c]}"></div>
      `).join('')}
    </div>
    <h3 class="section">Cargo Rates (per KG)</h3>
    <div class="sub" style="margin-top:-6px;">Save known shipping rates (e.g. Thailand → MM Air Cargo, 350 THB/kg) so you can price a shipping leg by weight instead of calculating it every time.</div>
    <div class="cargo-list" id="cargoRatesList">
      ${(s.cargoRates||[]).length ? s.cargoRates.map(r=>`
        <div class="cargo-row" data-id="${r.id}">
          <span>${escapeHtml(r.name)} — <span class="mono">${fmt2(r.amount)} ${r.currency}</span> / kg</span>
          <button type="button" class="icon-btn del-cargo" title="Delete">✕</button>
        </div>
      `).join('') : '<div class="muted">No cargo rates saved yet.</div>'}
    </div>
    <div class="row" style="margin-top:10px;">
      <div class="field grow"><label>Rate Name</label><input id="cr_name" placeholder="e.g. Thailand Air Cargo"></div>
      <div class="field"><label>Amount</label><input id="cr_amt" type="number" step="0.01" style="width:100px;"></div>
      <div class="field"><label>Currency</label><select id="cr_cur">${CURRENCIES.map(c=>`<option value="${c}">${c}</option>`).join('')}</select></div>
      <div class="field"><button type="button" class="btn jade small" id="cr_add">+ Add Rate</button></div>
    </div>
    <div class="row" style="margin-top:16px;"><button class="btn stamp" id="s_save">Save Settings</button></div>
  `;
  document.getElementById('s_save').addEventListener('click', async ()=>{
    const rates = {MMK:1};
    CURRENCIES.filter(c=>c!=='MMK').forEach(c=>{ rates[c] = parseFloat(document.getElementById('rate_'+c).value)||STATE.settings.rates[c]; });
    STATE.settings = Object.assign({}, STATE.settings, { businessName: document.getElementById('s_name').value.trim()||'My Shop',
      marginPct: parseFloat(document.getElementById('s_margin').value)||25, rates });
    await sSet('settings', STATE.settings); toast('Settings saved'); render();
  });
  document.getElementById('cr_add').addEventListener('click', async ()=>{
    const name = document.getElementById('cr_name').value.trim();
    const amount = parseFloat(document.getElementById('cr_amt').value)||0;
    const currency = document.getElementById('cr_cur').value;
    if(!name || !amount){ toast('Give the rate a name and amount'); return; }
    STATE.settings.cargoRates = (STATE.settings.cargoRates||[]).concat([{ id:uid(), name, amount, currency }]);
    await sSet('settings', STATE.settings); toast('Cargo rate saved'); renderSettings(document.getElementById('panel'));
  });
  document.querySelectorAll('.del-cargo').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      const id = e.target.closest('.cargo-row').dataset.id;
      if(!confirm('Delete this cargo rate?')) return;
      STATE.settings.cargoRates = (STATE.settings.cargoRates||[]).filter(r=>r.id!==id);
      await sSet('settings', STATE.settings); toast('Cargo rate deleted'); renderSettings(document.getElementById('panel'));
    });
  });
}

/* ---------------- data & backup ---------------- */
function renderData(panel){
  panel.innerHTML = `
    <h2>Data &amp; Backup</h2>
    <div class="sub">Export, back up, and move your ledger between devices.</div>
    <div class="info-box">
      This ledger now syncs live through Firebase — sign in with the same account on any device (signed in as <strong>${escapeHtml((auth.currentUser&&auth.currentUser.email)||'')}</strong>) and changes appear on both within a second or two, no refresh needed. The backup file below is still worth keeping as a periodic offline safety net, and is the way to move a snapshot into Google Drive yourself.
    </div>
    <h3 class="section">Export to Excel</h3>
    <div class="row"><button class="btn jade" id="d_excel">Download .xlsx (Orders, Products, Agents)</button></div>
    <h3 class="section">Backup</h3>
    <div class="row">
      <button class="btn ghost" id="d_backup">Download Backup File (.json)</button>
      <div class="field"><label>Restore from Backup</label><input type="file" id="d_restore" accept="application/json"></div>
    </div>
    <p class="muted" style="max-width:520px; margin-top:6px;">Download the backup file, then move it into your Google Drive folder (Drive app or desktop sync) to store it in the cloud. On another device, download that same file from Drive and use "Restore from Backup" here to load it in.</p>
    <h3 class="section">Reset</h3>
    <div class="row"><button class="btn danger" id="d_reset">Reset All Data</button>
    <span class="muted" style="align-self:center;">Deletes all orders, products, agents, and settings.</span></div>
  `;
  document.getElementById('d_excel').addEventListener('click', ()=>{
    try{
      const wb = XLSX.utils.book_new();
      const ordRows = STATE.orders.map(o=>({
        Date:o.orderDate, Customer:o.customer, Phone:o.phone, Product:o.product, Qty:o.qty,
        'Landed Cost (MMK)':Math.round(orderLandedMMK(o)), 'Sell Price (MMK)':Math.round(orderSellMMK(o)),
        'Deposit (MMK)':o.depositMMK, 'Balance (MMK)':Math.round(Math.max(0,orderSellMMK(o)-o.depositMMK)),
        Status:statusMeta(o.status).label, Agent:(STATE.agents.find(a=>a.id===o.agentId)||{}).name||'', Notes:o.notes
      }));
      const prodRows = STATE.products.map(p=>({ Code:p.code, Name:p.name, Category:p.category,
        'Landed Cost (MMK)':Math.round(p.landedCostMMK), 'Sell Price (MMK)':Math.round(p.sellPriceMMK), Notes:p.notes }));
      const agentRows = STATE.agents.map(a=>({ Name:a.name, Contact:a.contact, Location:a.location, Notes:a.notes }));
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(ordRows), 'Orders');
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(prodRows), 'Products');
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(agentRows), 'Agents');
      XLSX.writeFile(wb, `ledger-export-${new Date().toISOString().slice(0,10)}.xlsx`);
      toast('Excel file downloaded');
    }catch(e){ console.error(e); toast('Export failed — check console'); }
  });
  document.getElementById('d_backup').addEventListener('click', ()=>{
    const data = { orders:STATE.orders, agents:STATE.agents, products:STATE.products, settings:STATE.settings, exportedAt:new Date().toISOString() };
    const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download=`ledger-backup-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    toast('Backup downloaded');
  });
  document.getElementById('d_restore').addEventListener('change', (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = async (ev)=>{
      try{
        const data = JSON.parse(ev.target.result);
        if(!confirm('This will replace all current data with the backup file. Continue?')) return;
        STATE.orders = data.orders||[]; STATE.agents = data.agents||[]; STATE.products = data.products||[];
        STATE.settings = Object.assign({businessName:'My Shop', marginPct:25, rates:{MMK:1,USD:2100,THB:60,CNY:290,JPY:14,SGD:1550}, cargoRates:[], lastUsed:{}}, data.settings||{});
        await Promise.all([sSet('orders',STATE.orders), sSet('agents',STATE.agents), sSet('products',STATE.products), sSet('settings',STATE.settings)]);
        toast('Backup restored'); render();
      }catch(err){ console.error(err); toast('Could not read that file'); }
    };
    reader.readAsText(file);
  });
  document.getElementById('d_reset').addEventListener('click', async ()=>{
    if(!confirm('This deletes every order, product, and agent stored in this ledger. Continue?')) return;
    STATE.orders=[]; STATE.agents=[]; STATE.products=[];
    STATE.settings = {businessName:'My Shop', marginPct:25, rates:{MMK:1,USD:2100,THB:60,CNY:290,JPY:14,SGD:1550}, cargoRates:[], lastUsed:{}};
    await Promise.all([sSet('orders',[]), sSet('agents',[]), sSet('products',[]), sSet('settings', STATE.settings)]);
    toast('All data reset'); render();
  });
}
